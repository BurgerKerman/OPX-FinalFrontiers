@Kopernicus:AFTER[OPX-FinalFrontiers]:NEEDS[!OPM,!OPX-NeidonPlus,!OPX-UrlumPlus,!OPX-SarnusPlus]
{
  @Body[Anziephus,Ebenus,Eiwei,Dakara,Garrath,Ivor,Narog,Arkar,Kuvra]
  {
    @Orbit
    {
      @semiMajorAxis *= 0.1679069
    }
  }
  @Body[Nikto,Bye]:HAS[@OPX_FinalFrontiers_Settings:HAS[#PlockRevamp[False]]]
  {
    @Orbit
    {
      @referenceBody = Eeloo
    }
  }
}
